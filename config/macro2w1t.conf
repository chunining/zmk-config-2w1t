# Turn these on by removing the leading '#'.

# Report battery level over BLE (needs a battery on J1).
# CONFIG_ZMK_BATTERY_REPORTING=y

# Deep sleep after 15 minutes idle.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# USB logging over the serial port. Handy while debugging, costs battery.
# CONFIG_ZMK_USB_LOGGING=y
